[package]
name = "whatsbridge_rs"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "whatsbridge_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
android_logger = "0.14"
async-channel = "2.5"
base64 = "0.23"
buffa = { version = "0.9", default-features = false, features = ["json"] }
bytes = "1.10"
diesel = { version = "2.4.0", default-features = false, features = ["sqlite"] }
futures = "0.3"
jni = "0.21"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "sync", "time", "macros"] }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1851635a21e9df3c95635e877376876d25ac0da8", default-features = false, features = [
    "sqlite-storage-bundled",
    "tokio-transport",
    "tokio-native",
    "ureq-client",
    "voip-mlow",
    "voip-encoded",
    "voip-relay-native",
] }
whatsapp-rust-sqlite-storage = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1851635a21e9df3c95635e877376876d25ac0da8", default-features = false, features = ["bundled-sqlite"] }

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.release.package.diesel]
opt-level = "z"
[profile.release.package.diesel_migrations]
opt-level = "z"
[profile.release.package.r2d2]
opt-level = "z"
[profile.release.package.whatsapp-rust-sqlite-storage]
opt-level = "z"
[profile.release.package.ureq]
opt-level = "z"
[profile.release.package.ureq-proto]
opt-level = "z"
[profile.release.package.whatsapp-rust-ureq-http-client]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "z"
[profile.release.package.webpki-roots]
opt-level = "z"
[profile.release.package.http]
opt-level = "z"
[profile.release.package.libsqlite3-sys]
opt-level = "z"
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.tokio-websockets]
opt-level = "s"
[profile.release.package.whatsapp-rust-tokio-transport]
opt-level = "s"
[profile.release.package.wacore-appstate]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
