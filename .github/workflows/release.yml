name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Wupp Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK & Build Tools
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Derive version metadata from tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VER="${TAG#v}"
          BASE_VER="${CLEAN_VER%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VER}"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-1}"
          PATCH="${PATCH:-0}"
          BASE_CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 ))
          if [[ "$CLEAN_VER" == *"-"* ]]; then
            PRE_DIGITS=$(echo "${CLEAN_VER#*-}" | grep -oE '[0-9]+' | tail -n 1 || echo "1")
            PRE_NUM=$((10#${PRE_DIGITS:-1}))
            [ "$PRE_NUM" -ge 99 ] && PRE_NUM=98
            [ "$PRE_NUM" -lt 1 ] && PRE_NUM=1
          else
            PRE_NUM=99
          fi
          VER_CODE=$((BASE_CODE + PRE_NUM))
          if [ "${{ github.event.inputs.prerelease }}" = "true" ] || [[ "$TAG" == *"-"* ]]; then
            IS_PRE="true"
          else
            IS_PRE="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"

      - name: Build multi-ABI libwhatsbridge_rs.so
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          WUPP_RUST_ABIS: "arm64-v8a armeabi-v7a x86_64"
        run: bash rustbridge/build-android.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build Release APKs
        run: |
          gradle assembleRelease \
            -PWUPP_GITHUB_REPO=${{ github.repository }} \
            -PWUPP_VERSION_NAME=${{ steps.meta.outputs.version_name }} \
            -PWUPP_VERSION_CODE=${{ steps.meta.outputs.version_code }}

      - name: Extract Changelog Notes for Release
        id: notes
        run: |
          python3 - "${{ steps.meta.outputs.version_name }}" <<'PY'
          import os, re, sys
          ver = sys.argv[1]
          if not os.path.exists("CHANGELOG.md"):
              sys.exit(0)
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          m = re.search(pattern, text)
          if m:
              body = m.group(1).strip()
              if body:
                  repo = os.environ.get("GITHUB_REPOSITORY", "${{ github.repository }}")
                  body += f"\n\n**Full Changelog**: https://github.com/{repo}/releases/tag/v{ver}"
                  open("release_notes.md", "w", encoding="utf-8").write(body + "\n")
          PY
          if [ -s release_notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign & Package Variant APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/36.0.0/zipalign"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            KS_FILE="release.jks"
            KS_PASS="env:KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="env:KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore debug-fallback.jks -alias wupp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Wupp,O=Wupp,C=US"
            KS_FILE="debug-fallback.jks"
            KS_PASS="pass:android"
            K_ALIAS="wupp"
            K_PASS="pass:android"
          fi

          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            [ -f "$APK_PATH" ] || continue
            BASE_NAME=$(basename "$APK_PATH" | sed 's/-unsigned\.apk$/.apk/')
            "$ZIPALIGN" -p -f 4 "$APK_PATH" "dist/aligned_${BASE_NAME}"
            "$APKSIGNER" sign \
              --ks "$KS_FILE" \
              --ks-pass "$KS_PASS" \
              --ks-key-alias "$K_ALIAS" \
              --key-pass "$K_PASS" \
              --out "dist/${BASE_NAME}" "dist/aligned_${BASE_NAME}"
            rm -f "dist/aligned_${BASE_NAME}"
          done

          rm -f release.jks debug-fallback.jks
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Create GitHub Release (with CHANGELOG notes)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Wupp ${{ steps.meta.outputs.tag }}"
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Create GitHub Release (generated notes fallback)
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Wupp ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
