name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-bridge-check:
    name: Rust Bridge Check & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustbridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustbridge
          prefix-key: ci-host-v1
      - name: Check Rust bridge library
        run: cargo check --lib

  android-build:
    name: Android Build (Rust + Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustbridge
          prefix-key: ci-arm64-v1

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Build libwhatsbridge_rs.so (arm64-v8a)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: bash rustbridge/build-android.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build Debug APK
        run: gradle assembleDebug -PWUPP_GITHUB_REPO=${{ github.repository }}

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wupp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
