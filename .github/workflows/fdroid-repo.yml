name: Sync F-Droid Repo

on:
  workflow_run:
    workflows: ["Release APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-fdroid-repo:
    name: Build & Deploy F-Droid Repo
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate F-Droid repo signing secrets
        env:
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FDROID_REPO_KEYSTORE_BASE64" ]; then
            echo "::error::FDROID_REPO_KEYSTORE_BASE64 secret is not configured. Run scripts/setup-fdroid-repo-key.ps1 (or .sh) with -UploadSecrets / --upload first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Build Tools & fdroidserver
        run: |
          sdkmanager "build-tools;34.0.0"
          pip install --upgrade fdroidserver

      - name: Build F-Droid repository index from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_KEYSTORE_PASS: ${{ secrets.FDROID_REPO_KEYSTORE_PASS }}
          FDROID_REPO_KEY_PASS: ${{ secrets.FDROID_REPO_KEY_PASS }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_URL="https://${OWNER,,}.github.io/${REPO_NAME}/fdroid"

          mkdir -p fdroid_work/fdroid/repo fdroid_work/fdroid/archive fdroid_work/fdroid/metadata/com.wupp.app fdroid_site/fdroid
          cd fdroid_work/fdroid

          echo "$FDROID_REPO_KEYSTORE_BASE64" | base64 -d > keystore.p12
          chmod 600 keystore.p12
          KEY_ALIAS="${FDROID_REPO_KEY_ALIAS:-wupp-fdroid-repo}"

          cat > config.yml <<EOF
          sdk_path: ${ANDROID_SDK_ROOT}
          repo_url: ${BASE_URL}/repo
          repo_name: "Wupp F-Droid Repo"
          repo_description: "Official F-Droid repository for Wupp builds, auto-synced with GitHub Releases."
          archive_url: ${BASE_URL}/archive
          archive_name: "Wupp F-Droid Archive"
          archive_description: "Older releases of Wupp."
          archive_older: 3
          keystore: keystore.p12
          keystorepass: ${FDROID_REPO_KEYSTORE_PASS}
          keypass: ${FDROID_REPO_KEY_PASS}
          repo_keyalias: ${KEY_ALIAS}
          EOF
          chmod 600 config.yml

          mkdir -p metadata/com.wupp.app
          if [ -d "../../fastlane/metadata/android" ]; then
            cp -r ../../fastlane/metadata/android/* metadata/com.wupp.app/
          fi

          cat > metadata/com.wupp.app.yml <<EOF
          Categories:
            - Internet
          License: MIT
          SourceCode: https://github.com/${GITHUB_REPOSITORY}
          IssueTracker: https://github.com/${GITHUB_REPOSITORY}/issues
          Changelog: https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md
          Name: Wupp
          EOF

          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GH_TOKEN", "")
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "Wupp-FDroid-Sync"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=6", headers=headers)
          with urllib.request.urlopen(req, timeout=30) as resp:
              releases = json.loads(resp.read().decode("utf-8"))

          count = 0
          for rel in releases:
              if rel.get("draft"):
                  continue
              assets = [a for a in rel.get("assets", []) if a.get("name", "").endswith(".apk")]
              if not assets:
                  continue
              fdroid_assets = [a for a in assets if "-fdroid-" in a["name"].lower()]
              chosen = fdroid_assets if fdroid_assets else assets
              for a in chosen:
                  name = a["name"]
                  url = a["browser_download_url"]
                  print(f"Downloading {name} from {rel.get('tag_name')}...")
                  dl_req = urllib.request.Request(url, headers={"User-Agent": "Wupp-FDroid-Sync"})
                  with urllib.request.urlopen(dl_req, timeout=120) as dl_resp:
                      open(os.path.join("repo", name), "wb").write(dl_resp.read())
              count += 1
              if count >= 4:
                  break
          PY

          fdroid update --pretty --use-date-from-apk

          FP=$(keytool -list -v -keystore keystore.p12 -storepass "$FDROID_REPO_KEYSTORE_PASS" -alias "$KEY_ALIAS" | awk -F'SHA256: ' '/SHA256:/{gsub(/:/,"",$2); print $2; exit}')

          # Stage ONLY public F-Droid directories (never copy keystore.p12 or config.yml)
          cp -r repo ../../fdroid_site/fdroid/repo
          if [ -d archive ]; then
            cp -r archive ../../fdroid_site/fdroid/archive
          fi

          REPO_FULL_URL="${BASE_URL}/repo"
          FDROID_DEEP_LINK="fdroidrepos://${OWNER,,}.github.io/${REPO_NAME}/fdroid/repo?fingerprint=${FP}"

          cat > ../../fdroid_site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Wupp F-Droid Repo</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; padding: 0 20px; background: #0f1412; color: #e9edef; line-height: 1.5; }
              .card { background: #18201c; border: 1px solid #26352e; border-radius: 16px; padding: 24px; }
              a.btn { display: inline-block; margin-top: 16px; padding: 12px 20px; background: #25d366; color: #092014; font-weight: 700; text-decoration: none; border-radius: 10px; }
              code { display: block; padding: 12px; background: #0b100e; border-radius: 8px; overflow-wrap: anywhere; font-size: 13px; margin: 8px 0 16px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Wupp F-Droid Repository</h1>
              <p>Add this repository in the F-Droid app to install Wupp and get automatic updates synced with GitHub Releases.</p>
              <a class="btn" href="${FDROID_DEEP_LINK}">Add to F-Droid</a>
              <h3>Repository URL</h3>
              <code>${REPO_FULL_URL}</code>
              <h3>SHA-256 Signing Fingerprint</h3>
              <code>${FP}</code>
              <p><a href="https://github.com/${GITHUB_REPOSITORY}" style="color:#53d78a;">View Source on GitHub</a></p>
            </div>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
