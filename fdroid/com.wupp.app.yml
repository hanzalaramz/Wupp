# Target builds starting from the first release tag after adding the fdroid flavor (e.g. v0.2.1 / v0.3.0).
# For reproducible builds on official F-Droid, uncomment Binaries once the fdroid universal APK uses your release key:
# Binaries: https://github.com/hanzalaramz/Wupp/releases/download/v%v/Wupp-%v-fdroid-universal.apk

Builds:
  - versionName: 0.2.1
    versionCode: 201990
    commit: v0.2.1
    subdir: app
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/Wupp-0.2.1-fdroid-universal.apk
    ndk: r27c
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends golang-go
    prebuild:
      - rm -f libs/*.aar libs/*.jar
      - export GOPATH="$PWD/.gopath"
      - export PATH="$GOPATH/bin:$PATH"
      - go install golang.org/x/mobile/cmd/gomobile@latest
      - go install golang.org/x/mobile/cmd/gobind@latest
      - ANDROID_HOME="$$SDK$$" ANDROID_NDK_HOME="$$NDK$$" gomobile init
      - cd ../whatsbridge && ANDROID_HOME="$$SDK$$" ANDROID_NDK_HOME="$$NDK$$" gomobile bind -javapkg=com.wa.bridge -ldflags="-s -w" -target=android/arm64,android/arm,android/amd64 -androidapi 26 -o ../app/libs/whatsbridge.aar .
    scandelete:
      - app/libs/*.aar
      - app/libs/*.jar

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 0.2.1
CurrentVersionCode: 201990
